<!doctype html>
<!--
  Source of public/og-image.png (1200×630).

  Render it with `node tools/generate-og-image.mjs`; do not hand-edit the PNG.
  Colours are copied from src/styles.scss on purpose — this file is rendered by
  Chrome outside the Angular build, so it cannot read the CSS custom properties.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    padding: 72px 80px 64px;
    background: #f7f9fc;
    color: #0e1b2d;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 66px; height: 66px; }
  .brand strong { font-size: 33px; font-weight: 600; letter-spacing: -0.01em; }
  .main { margin-top: auto; margin-bottom: auto; }
  h1 { font-size: 76px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.04; }
  p { margin-top: 24px; max-width: 900px; font-size: 30px; font-weight: 400; line-height: 1.36; color: #55657c; }
  .rule { width: 132px; height: 7px; margin-top: 36px; background: #1668d8; }
  .foot { display: flex; align-items: center; gap: 12px; }
  .chip {
    padding: 9px 22px;
    border: 1px solid #dde5ef;
    border-radius: 999px;
    background: #ffffff;
    font-size: 23px;
    color: #55657c;
  }
  .domain {
    margin-left: auto;
    font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 25px;
    color: #1668d8;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="../public/brand-mark.png" alt="">
    <strong>RelaxKon</strong>
  </div>

  <div class="main">
    <h1>Desktops beyond devices.</h1>
    <p>A cross-platform remote workspace operating environment: local UI rendering, persistent applications, server-managed workspaces.</p>
    <div class="rule"></div>
  </div>

  <div class="foot">
    <span class="chip">Windows</span>
    <span class="chip">Linux</span>
    <span class="chip">macOS</span>
    <span class="chip">Android</span>
    <span class="domain">relaxkon.com</span>
  </div>
</body>
</html>
