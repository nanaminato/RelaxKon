<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RelaxKon — Desktops beyond devices</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RelaxKonOS is a cross-platform remote workspace operating environment with local UI rendering, persistent applications and server-managed workspaces.">
  <meta name="theme-color" content="#f7f9fc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <script>
    // Resolve the theme before the first paint so the palette never flashes.
    (function () {
      try {
        var stored = localStorage.getItem('rk-theme');
        var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
        var dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var saved = localStorage.getItem('rk-language');
        if (saved === 'en-US' || saved === 'zh-CN' || saved === 'ja-JP') {
          document.documentElement.lang = saved;
        } else {
          var locale = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
          document.documentElement.lang = locale.indexOf('zh') === 0 ? 'zh-CN' : locale.indexOf('ja') === 0 ? 'ja-JP' : 'en-US';
        }
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
